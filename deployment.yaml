apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: my-app-container
        image: my-app:latest
        imagePullPolicy: IfNotPresent  # <--- THIS IS THE MAGIC LINE
        ports:
        - containerPort: 80
